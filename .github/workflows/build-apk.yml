name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Android builder repository
        uses: actions/checkout@v4

      - name: Checkout v4.1.0 Android baseline
        uses: actions/checkout@v4
        with:
          repository: RODRIGODESS/monitor-de-noticias-apk
          ref: 5c7c78c88cc9c5111232d7765574dbdc739ad16b
          path: source

      - name: Keep only Android module
        shell: bash
        run: sed -i '/include(":desktop")/d' source/settings.gradle.kts

      - name: Synchronize final Windows terms and sources
        shell: bash
        run: python3 tools/sync_windows_changes.py source

      - name: Apply verified YouTube corrections
        shell: bash
        run: python3 tools/youtube_v412_patch.py source

      - name: Validate synchronized catalog
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 412' source/app/build.gradle.kts
          grep -q '"STM"' source/app/src/main/java/br/com/monitordenoticias/android/NewsDb.kt
          grep -q '"ENGEPRON"' source/app/src/main/java/br/com/monitordenoticias/android/NewsDb.kt
          grep -q 'Poder Aéreo' source/app/src/main/java/br/com/monitordenoticias/android/SourceCatalog.kt
          grep -q 'GBN News' source/app/src/main/java/br/com/monitordenoticias/android/SourceCatalog.kt
          grep -q 'A Tribuna' source/app/src/main/java/br/com/monitordenoticias/android/SourceCatalog.kt
          grep -q 'UCaGmdJSSiR7fkh2A-c6emsA' source/app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          grep -q 'youtube-domingo-espetacular' source/app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          grep -q '@domingoespetacular' source/app/src/main/java/br/com/monitordenoticias/android/VideoSourceCatalog.kt
          grep -q 'KEY_YOUTUBE_412_MIGRATED' source/app/src/main/java/br/com/monitordenoticias/android/VideoViewModel.kt
          grep -q 'identifier.startsWith("UC")' source/app/src/main/java/br/com/monitordenoticias/android/VideoRepository.kt

      - name: Verify all official YouTube video tabs live
        shell: bash
        run: python3 tools/verify_youtube_routes.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK and checksum
        shell: bash
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk monitor-de-noticias-v4.1.2-youtube-verified-debug.apk
          sha256sum monitor-de-noticias-v4.1.2-youtube-verified-debug.apk | tee monitor-de-noticias-v4.1.2-youtube-verified-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-de-noticias-v4.1.2-youtube-verified-debug-apk
          path: |
            monitor-de-noticias-v4.1.2-youtube-verified-debug.apk
            monitor-de-noticias-v4.1.2-youtube-verified-debug.apk.sha256
          if-no-files-found: error

      - name: Publish/update verified test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v4.1.2-youtube-verified-debug"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          notes="Android v4.1.2: mantém a sincronização Windows e corrige/valida todas as fontes oficiais do YouTube. g1 usa o channel ID oficial UCaGmdJSSiR7fkh2A-c6emsA; Domingo Espetacular usa @domingoespetacular; CNN Brasil, Jovem Pan News, GloboNews, Record News, Jornal da Record, Band Jornalismo e SBT News também são validados diretamente na aba /videos antes do assembleDebug."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" monitor-de-noticias-v4.1.2-youtube-verified-debug.apk monitor-de-noticias-v4.1.2-youtube-verified-debug.apk.sha256 --clobber
            gh release edit "$tag" --title "Monitor de Notícias Android v4.1.2 — YouTube verificado" --notes "$notes" --prerelease
          else
            gh release create "$tag" monitor-de-noticias-v4.1.2-youtube-verified-debug.apk monitor-de-noticias-v4.1.2-youtube-verified-debug.apk.sha256 \
              --title "Monitor de Notícias Android v4.1.2 — YouTube verificado" \
              --notes "$notes" \
              --prerelease
          fi
