name: Verify YouTube Sources

on:
  push:
    branches: ["main"]
    paths:
      - "tools/discover_youtube_channels.py"
      - ".github/workflows/verify-youtube.yml"
  workflow_dispatch:

jobs:
  verify-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify configured channels and discover Domingo Espetacular
        run: python3 tools/discover_youtube_channels.py
